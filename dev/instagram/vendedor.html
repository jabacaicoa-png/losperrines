<!doctype html><html><head><meta charset="utf-8">
<!-- Placa para el estado de WhatsApp de cada vendedor (1080×1920), con su código impreso.
     Se genera con: node dev/instagram/vendedor.js <salida> <foto.jpg> CODIGO [CODIGO2 ...]
     La foto (los dos perros en la funda) no está en el repo porque es público: pedírsela al dueño. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=block" rel="stylesheet">
<style>
:root{--olive:#4E5B3A;--dark:#1E2418;--yel:#D9E15A;--cream:#F2F3EC;--green:#2E7D32}
*{box-sizing:border-box;margin:0}
body{font-family:"Bricolage Grotesque",sans-serif}
#h{position:relative;width:1080px;height:1920px;background:var(--olive);overflow:hidden}
.top{position:absolute;top:80px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px;color:var(--cream);font-weight:700;font-size:44px}
.top img{width:96px;height:96px;border-radius:50%}
.foto{position:absolute;top:210px;left:60px;right:60px;height:620px;border-radius:44px;overflow:hidden;border:6px solid var(--yel)}
.foto img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.tit{position:absolute;top:870px;left:60px;right:60px;color:#fff;font-weight:800;font-size:84px;line-height:.98;letter-spacing:-.02em}
.chips{position:absolute;top:1075px;left:60px;right:60px;display:flex;gap:12px;justify-content:space-between}
.chip{background:#DDEFFB;color:#0E4A6E;border-radius:999px;font-weight:800;font-size:34px;padding:10px 20px;white-space:nowrap}
.cod{position:absolute;top:1180px;left:60px;right:60px;background:var(--yel);border-radius:36px;padding:34px 36px;text-align:center;color:var(--dark)}
.cod .l{font-size:40px;font-weight:700}
.cod .c{display:inline-block;margin:14px 0 10px;background:#fff;border:5px dashed var(--dark);border-radius:22px;padding:8px 40px;font-size:96px;font-weight:800;letter-spacing:.06em}
.cod .d{font-size:56px;font-weight:800}
.pre{position:absolute;top:1580px;left:60px;right:60px;background:var(--cream);border-radius:30px;padding:22px 32px;display:flex;justify-content:space-between;align-items:center}
.pre .n{font-size:36px;font-weight:700;color:var(--dark);line-height:1.15}
.pre .n small{display:block;font-size:28px;color:#555;font-weight:600}
.pre .v{text-align:right;line-height:1}
.pre .v s{font-size:34px;color:#777;font-weight:600}
.pre .v b{display:block;font-size:66px;font-weight:800;color:var(--green)}
.pie{position:absolute;top:1775px;left:0;right:0;text-align:center;color:var(--cream);font-weight:700;font-size:38px;line-height:1.3}
.pie b{font-weight:800;font-size:44px}
</style></head><body>
<section id="h">
 <div class="top"><img src="logo.png">Los Perrines</div>
 <div class="foto"><img src="foto.jpg"></div>
 <div class="tit">¿Viajás con tu perro?<br>El auto queda limpio.</div>
 <div class="chips"><span class="chip">💧 Impermeable</span><span class="chip">🛋️ Acolchada</span><span class="chip">💪 Antidesgarro</span></div>
 <div class="cod"><div class="l">Con mi código</div><div class="c" id="codigo">LAURA</div><div class="d">$2.000 de descuento</div></div>
 <div class="pre"><span class="n">Canasto de 2 plazas<small>por transferencia, con el código</small></span><span class="v"><s>$ 75.000</s><b>$ 73.000</b></span></div>
 <div class="pie">🚚 Envío gratis a todo el país<br><b>losperrines.com.ar</b></div>
</section></body></html>
