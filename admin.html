<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Los Perrines · Administración</title>
<link rel="manifest" href="admin.webmanifest">
<link rel="apple-touch-icon" href="iconos/admin-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="iconos/admin-192.png">
<meta name="theme-color" content="#4E5B3A">
<meta name="apple-mobile-web-app-title" content="LP Admin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --olive:#4E5B3A; --olive-deep:#3A4529; --ball:#D9E15A; --bg:#F2F3EC; --card:#FFFFFF;
  --ink:#1E2418; --muted:#5E6656; --line:#D9DCCF; --field:#F7F8F3; --on-olive:#F2F3EC;
  --ok:#2F7A3E; --warn:#A86A12; --bad:#B4432F; --info:#2F5E8A;
  --ok-bg:#E5F1E4; --bad-bg:#F8E6E1; --warn-bg:#F7EEDB; --info-bg:#E3ECF5;
  --side:236px;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --olive:#6E7D55; --olive-deep:#2A3220; --bg:#14170F; --card:#1D2217; --ink:#EEF0E6; --muted:#A5AD98;
    --line:#323A28; --field:#181C13; --ok:#6CC27D; --warn:#E3A84B; --bad:#E27A66; --info:#7FB0DE;
    --ok-bg:#1F2E1F; --bad-bg:#352019; --warn-bg:#33291A; --info-bg:#1A2633; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --olive:#6E7D55; --olive-deep:#2A3220; --bg:#14170F; --card:#1D2217; --ink:#EEF0E6; --muted:#A5AD98;
  --line:#323A28; --field:#181C13; --ok:#6CC27D; --warn:#E3A84B; --bad:#E27A66; --info:#7FB0DE;
  --ok-bg:#1F2E1F; --bad-bg:#352019; --warn-bg:#33291A; --info-bg:#1A2633; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px;border-radius:4px}
[hidden]{display:none !important}
h1,h2,h3{letter-spacing:-.02em;text-wrap:balance}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;width:min(380px,100%)}
.login h1{margin:0 0 6px;font-size:1.6rem}
.login p{margin:0 0 18px;color:var(--muted)}

/* estructura */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
@media(min-width:960px){.shell{grid-template-columns:var(--side) minmax(0,1fr)}}
aside.nav{background:var(--card);border-right:1px solid var(--line);padding:14px 12px 18px;display:flex;flex-direction:column;gap:2px}
@media(min-width:960px){aside.nav{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto}}
@media(max-width:959px){
  aside.nav{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(16px + env(safe-area-inset-top,0px));overflow-y:auto}
  .shell.menu aside.nav{transform:none}
  .shell.menu::after{content:"";position:fixed;inset:0;background:rgba(20,24,14,.45);z-index:35}
}
@media (prefers-reduced-motion: reduce){aside.nav{transition:none}}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;padding:4px 8px 12px}
.brand svg{width:30px;height:30px;flex:none}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:.8rem}
.ngroup{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 2px}
.nlink{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:7px 10px;font-weight:600;cursor:pointer;color:var(--ink)}
.nlink:hover{background:var(--field)}
.nlink[aria-current="page"]{background:var(--olive);color:var(--on-olive)}
.nlink .pill{background:var(--ball);color:#1E2418;border-radius:999px;font-size:.72rem;font-weight:800;padding:0 7px;line-height:19px;min-width:19px;text-align:center}
.nlink .pill.bad{background:var(--bad);color:#fff}
.nav .foot{margin-top:auto;padding-top:16px;display:flex;gap:8px}
.topm{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
@media(min-width:960px){.topm{display:none}}
.topm b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:20px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px));max-width:1180px;width:100%;min-width:0}
@media(min-width:960px){main{padding:26px 32px 80px}}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{font-size:1.5rem;margin:0}
.ph .sub{margin:4px 0 0}
h3{font-size:1.06rem;margin:0 0 10px}
.sub{color:var(--muted);margin:-4px 0 14px;max-width:72ch}
.muted{color:var(--muted)} .small{font-size:.85rem}

/* bloques */
.block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;min-width:0}
.block>h3:first-child{margin-top:0}
.cards{display:grid;gap:12px;margin-top:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.kpi small{color:var(--muted);display:block}
.kpi b{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.kpi .k2{font-size:.82rem;color:var(--muted);display:block;margin-top:2px}
.kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)}
.cols2{display:grid;gap:14px}
@media(min-width:860px){.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols2>.block{margin-top:0}

/* stock hero */
.stock{background:var(--olive);color:var(--on-olive);border-radius:20px;padding:20px;display:grid;gap:16px}
@media(min-width:760px){.stock{grid-template-columns:auto 1fr;align-items:center;gap:28px}}
.stock .avail b{display:block;font-size:3.6rem;line-height:.95;font-weight:800;letter-spacing:-.04em}
.stock .avail span{opacity:.85}
.meter{height:14px;border-radius:8px;background:rgba(242,243,236,.18);display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.92rem}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.alert{margin-top:12px;background:rgba(217,225,90,.18);border:1px solid rgba(217,225,90,.5);border-radius:12px;padding:10px 12px;font-weight:600}

/* pedidos */
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;flex-wrap:wrap}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.order{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.order .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.order .who b{display:block}
.order .who small,.order .meta{color:var(--muted);font-size:.9rem}
.order .amt{text-align:right;white-space:nowrap}
.order .amt b{display:block;font-size:1.1rem}
.order .meta{margin-top:8px}
.order .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;border:1.5px solid currentColor}
.st.reserva,.st.pendiente_mp{color:var(--warn)} .st.pagado{color:var(--ok)} .st.exportado{color:var(--info)} .st.despachado{color:var(--info)} .st.entregado{color:var(--ok)} .st.cancelado{color:var(--muted)} .st.vencido{color:var(--bad)}

/* botones y campos */
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;line-height:1.2}
.btn.main{background:var(--olive);color:var(--on-olive)}
.btn.ball{background:var(--ball);color:#1E2418}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
.btn.big{padding:13px 18px;font-size:1.02rem}
.btn.sm{padding:6px 10px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:default}
.linkb{background:none;border:0;padding:0;color:var(--info);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{color:var(--muted);padding:18px;text-align:center;border:1.5px dashed var(--line);border-radius:14px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:.86rem;font-weight:600;color:var(--muted);min-width:0}
.f input,.f select,.f textarea,.inp{font:500 1rem "Bricolage Grotesque",sans-serif;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.f textarea{resize:vertical}
.inp.xs{width:84px;padding:6px 8px;text-align:right}
.inp.sm{width:120px}
.unitw{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:520px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.err{color:var(--bad);font-weight:600;min-height:1.2em;margin:8px 0 0}

/* tablas */
.tw{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:800;border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--field)}
tr.off td{opacity:.55}
.pos{color:var(--ok);font-weight:700} .neg{color:var(--bad);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.mute{background:var(--field);color:var(--muted);border:1px solid var(--line)}
.note{border-radius:12px;padding:10px 12px;font-size:.9rem;margin-top:12px;background:var(--field);border:1px solid var(--line)}
.note.bad{background:var(--bad-bg);border-color:transparent} .note.ok{background:var(--ok-bg);border-color:transparent} .note.warn{background:var(--warn-bg);border-color:transparent} .note.info{background:var(--info-bg);border-color:transparent}

/* diálogos y avisos */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
dialog{border:0;border-radius:18px;padding:0;width:min(640px,94vw);max-height:90vh;background:var(--card);color:var(--ink)}
dialog.wide{width:min(900px,96vw)}
dialog::backdrop{background:rgba(20,24,14,.5)}
.dlg{padding:20px}
.dlg .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.dlg .row h3{margin:0}
.dlg .acts{justify-content:flex-end;margin-top:14px}
.x{background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--muted);line-height:1}
.inline{display:flex;gap:8px;margin-top:10px}
.inline input{flex:1;min-width:0}
.store{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.store b{font-size:1.1rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:0}
.cfg-row{border-top:1px solid var(--line);padding:12px 0}
.cfg-row:first-child{border-top:0}
.medgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.medcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.medcard img,.medvid{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--field)}
.medvid{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2rem;color:var(--muted)}
.medvid small{font-size:.8rem}
.medbadge{position:absolute;top:8px;left:8px;background:var(--ball);color:#1E2418;font-weight:700;font-size:.75rem;border-radius:999px;padding:2px 8px}
.medacts{display:flex;gap:4px;padding:6px;justify-content:space-between}
.medacts .btn{padding:6px 8px;flex:1}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.copy{word-break:break-all;background:var(--field);border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem}
.todo{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.todo li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--field);border-left:4px solid var(--warn)}
.todo li.bad{border-left-color:var(--bad)} .todo li.info{border-left-color:var(--info)} .todo li.ok{border-left-color:var(--ok)}
/* pantalla Publicidad */
.embudo{display:grid;gap:8px}
.embudo .paso{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.embudo .barra{height:14px;border-radius:7px;background:var(--field);overflow:hidden;border:1px solid var(--line)}
.embudo .barra i{display:block;height:100%;background:var(--olive)}
.embudo .paso.peor .barra i{background:var(--warn)}
@media(max-width:520px){.embudo .paso{grid-template-columns:1fr auto}.embudo .barra{grid-column:1/-1;order:3}}
/* pantalla Hoy */
.hoysteps{display:grid;gap:8px;margin:0 0 14px;grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:640px){.hoysteps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hoystep{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.hoystep small{display:block;color:var(--muted);font-size:.8rem;line-height:1.2}
.hoystep b{display:block;font-size:1.5rem;font-weight:800;line-height:1.15}
.hoystep span{display:block;font-size:.76rem;font-weight:700;color:var(--bad)}
.hoystep.bad{border-color:var(--bad)}
.hoybar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 4px}
.hoyp{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;background:var(--field);margin-top:8px}
.hoyp.bad{border-left-color:var(--bad)} .hoyp.warn{border-left-color:var(--warn)}
.hoyp>input[type=checkbox]{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--olive)}
.hoyb{flex:1;min-width:0;display:grid;gap:2px}
.hoyh{display:flex;justify-content:space-between;gap:10px}
.hoyal{font-weight:700} .hoyp.bad .hoyal{color:var(--bad)} .hoyp.warn .hoyal{color:var(--warn)}
</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:grid;place-items:center"><span class="spinner"></span></div></div>
<dialog id="dlg"><div class="dlg" id="dlgIn"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== Pegá acá la URL de tu Apps Script (termina en /exec) ===== */
var API = "https://script.google.com/macros/s/AKfycbzjecDhiNGDrmWjWtz8U2HIBwoQDbptu4xiogljKkCeJQrGXh4rn7f0PsXDbypAZCxbVQ/exec";
</script>
<script>
/* Carga el panel siempre en su última versión (sin copias viejas guardadas en el navegador) */
(function(){
  var v=Date.now(), archivos=["admin-core.js","admin-hoy.js","admin-taller.js","admin-publicidad.js","admin-tablero.js"], i=0;
  function siguiente(){
    if(i>=archivos.length){ LP.arrancar(); return; }
    var s=document.createElement("script"); s.src=archivos[i++]+"?v="+v; s.onload=siguiente;
    s.onerror=function(){ document.getElementById("root").innerHTML='<div class="login"><form><h1>Los Perrines</h1><p>No se pudo cargar el panel. Revisá la conexión y recargá la página.</p></form></div>'; };
    document.body.appendChild(s);
  }
  siguiente();
})();
</script>
</body>
</html>
