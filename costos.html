    --gain:#5ACB8E; --loss:#EC7F70; --field:#131C19; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1614; --card:#18221F; --ink:#E7EEEB; --muted:#94A49E; --line:#2A3632;
  --pine:#4FB8A2; --pine-ink:#08201B; --pine-soft:#173430; --amber:#F2B455;

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.wrap{max-width:640px;margin:0 auto;padding:12px 14px 40px}

.ptab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ptab.add{border-style:dashed;color:var(--muted)}
.ptitle{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.ptitle .eyebrow{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ptitle h1{margin:0;font-size:1.4rem;line-height:1.2;letter-spacing:-.02em}
.pacts{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 10px;font:600 .88rem inherit;font-family:inherit;cursor:pointer}

.prod-btn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 4px;cursor:pointer;text-align:left;min-width:0}
.prod-btn .eyebrow{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prod-btn .name{display:block;font-size:1.25rem;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-btn .chev{flex:none;color:var(--muted)}
.sync{font-size:.75rem;color:var(--muted);text-align:right;flex:none}
/* hero */
.hero{background:var(--pine);color:var(--pine-ink);border-radius:18px;padding:18px 18px 14px;box-shadow:var(--shadow)}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .lbl{font-size:.8rem;opacity:.85;font-weight:600}
.hero .gain{font-size:2.6rem;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.hero .rent{text-align:right}
.hero .rent b{display:block;font-size:1.6rem;font-weight:800;line-height:1.1}
.hero .bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:14px 0 8px;background:rgba(255,255,255,.25)}
.hero .bar span{display:block;height:100%}
.hero .bar .c{background:rgba(255,255,255,.55)}
.hero .bar .g{background:var(--amber)}
.hero .legend{display:flex;justify-content:space-between;font-size:.82rem;gap:10px}

.item .v{font-weight:800;white-space:nowrap}

.sw[aria-checked="true"]{background:var(--pine)}
.sw[aria-checked="true"]::after{left:19px}

.sh-actions{display:flex;gap:10px;margin-top:6px}

.wa{color:var(--pine);font-weight:800;text-decoration:none;white-space:nowrap}
.mini{font-size:.82rem;color:var(--muted)}
.prod-row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;text-align:left}

textarea.share{min-height:220px;font:500 .9rem/1.45 ui-monospace,Menlo,Consolas,monospace}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
</style>

function migrate(old){
  var provs={}; (old.proveedores||[]).forEach(function(p){provs[p.id]=p;});
  var ins={}; (old.insumos||[]).forEach(function(i){ins[i.id]=i;});
  var prods=(old.productos||[]).map(function(p){
    var items=[];
    (p.lineas||[]).forEach(function(l){
      var i=ins[l.insumoId]; if(!i) return; var pv=provs[i.proveedorId]||{};
      items.push({id:uid(),clase:"compra",concepto:i.nombre||"",proveedor:pv.nombre||"",telefono:pv.telefono||"",lugar:pv.lugar||"",total:n(i.total),cantidad:n(i.cantidad),unidad:i.unidad||"u",modo:l.modo==="lote"?"lote":"unidad",uso:n(l.consumo),incluir:true,notas:i.notas||""});
    });
    (p.extras||[]).forEach(function(e){
      var pv=null; if(/susana/i.test(e.nombre||"")) pv=(old.proveedores||[]).find(function(x){return /susana/i.test(x.nombre||"");});
      items.push({id:uid(),clase:"fijo",concepto:e.nombre||"",proveedor:pv?pv.nombre:"",telefono:pv?pv.telefono||"":"",lugar:pv?pv.lugar||"":"",monto:n(e.monto),cuando:e.tipo==="venta"?"venta":"fab",incluir:!!e.incluir,notas:""});
    });
    return {id:p.id||uid(),nombre:p.nombre||"Producto",lote:n(p.lote)||1,precio:n(p.precio),items:items};
  });
  return {productos:prods, activo:prods[0]?prods[0].id:null};
}

/* ---------- guardado ---------- */
function persist(){
  var json=JSON.stringify(state);
  try{ localStorage.setItem(LS,json); }catch(e){}
  if(store.cloud){
    api("guardarCostos",{data:JSON.parse(json)}).then(function(){setSync("Guardado en tu planilla");}).catch(function(e){setSync(e.message==="SESION"?"Sesión vencida: volvé a entrar al panel":"Guardado solo en este dispositivo");});
  } else setSync("Guardado en este dispositivo");
}
function save(){ setSync("Guardando…"); clearTimeout(timer); timer=setTimeout(persist,500); }

var API="https://script.google.com/macros/s/AKfycbzjecDhiNGDrmWjWtz8U2HIBwoQDbptu4xiogljKkCeJQrGXh4rn7f0PsXDbypAZCxbVQ/exec";
function api(accion,data){
  var body=Object.assign({accion:accion,token:sessionStorage.getItem("lp_token")||""},data||{});
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(j){ if(!j.ok) throw new Error(j.error||"Error"); return j; });
}
function boot(){
  try{ var raw=localStorage.getItem(LS); if(raw) state=norm(JSON.parse(raw)); }catch(e){}
  if(!state.productos.length && window.__SEED__) state=norm(JSON.parse(JSON.stringify(window.__SEED__)));
  render();
  if(!sessionStorage.getItem("lp_token")){ setSync("Entrá desde el panel para guardar en tu planilla"); return; }
  setSync("Cargando…");
  api("costos").then(function(r){
    store.cloud=true;
    if(r.costos && r.costos.productos && r.costos.productos.length){ state=norm(r.costos); render(); setSync("Guardado en tu planilla"); }
    else { persist(); }
  }).catch(function(e){ setSync(e.message==="SESION"?"Sesión vencida: volvé a entrar al panel":"Sin conexión: guardado en este dispositivo"); });
}

/* ---------- cálculo ---------- */
function prod(){ var p=state.productos.find(function(x){return x.id===state.activo;})||state.productos[0]; if(p) state.activo=p.id; return p; }
function pl(w,k){ w=String(w||"unidad"); if(Math.abs(k-1)<1e-9||/s$/i.test(w)) return w; return /[aeiouáéó]$/i.test(w)? w+"s" : w+"es"; }
function unitP(it){ return n(it.contenido)>0? n(it.precio)/n(it.contenido):0; }
function cost(p,it){ if(it.clase==="fijo") return it.base==="lote"? (n(p.lote)>0? n(it.monto)/n(p.lote):0) : n(it.monto); return n(it.uso)*unitP(it); }
function compra(p,it){
  var need=n(it.uso)*n(p.lote), env=n(it.contenido)>0? need/n(it.contenido):0, buy=Math.ceil(env-1e-9);
  return {need:need, env:env, buy:buy, total:buy*n(it.precio), sobra:Math.max(0,buy*n(it.contenido)-need)};
}
function hayTelaMarcada(p,excepto){ return !!p&&p.items.some(function(i){return i.clase!=="fijo"&&i.esTela&&(!excepto||i.id!==excepto.id);}); }
function telaItem(p){ // la tela es el material en metros que más cuesta por unidad
  var mats=p.items.filter(function(i){return i.clase!=="fijo"&&i.incluir!==false&&/^m(etros?)?\.?$/i.test(String(i.unidad||"").trim());}), best=null, bc=-1;
  mats.forEach(function(i){ var c=cost(p,i); if(c>bc){ bc=c; best=i; } });
  return best;
}
function metrosTela(p){ var t=telaItem(p); return t&&t.incluir!==false? n(t.uso):0; }
function gcTotal(){ return (state.compartidos.gastos||[]).reduce(function(a,g){return a+(g.incluir===false?0:n(g.total));},0); }
function gcPorMetro(){ var r=n(state.compartidos.rollo); return r>0? gcTotal()/r : 0; }
function gcUnit(p){ return gcPorMetro()*metrosTela(p); }
function calc(p){
  var mat=0,fab=gcUnit(p),venta=0,compras=0;
  p.items.forEach(function(it){ if(!it.incluir) return; var c=cost(p,it);
    if(it.clase==="fijo"){ if(it.cuando==="venta") venta+=c; else fab+=c; } else { mat+=c; compras+=compra(p,it).total; } });
  var precio=n(p.precio), lote=n(p.lote), prodC=mat+fab, total=prodC+venta, gan=precio-total, neto=precio-venta;
  var inv=compras+fab*lote, ingreso=precio*lote, ganLote=ingreso-inv-venta*lote;
  return {mat:mat,fab:fab,gc:gcUnit(p),venta:venta,prod:prodC,total:total,gan:gan,compras:compras,
    margen:precio>0?gan/precio*100:0, rent:total>0?gan/total*100:0,
    inv:inv, ventaLote:venta*lote, ingreso:ingreso, ganLote:ganLote,
    recupero: neto>0&&inv>0? Math.ceil(inv/neto-1e-9):null};
}
function subline(p,it){
  if(it.clase==="fijo") return [it.proveedor, it.base==="lote"? $m(n(it.monto))+" ÷ "+Q.format(n(p.lote))+" unidades" : "", it.cuando==="venta"?"Se paga por venta":"Se paga al fabricar"].filter(Boolean).join(" · ");
  var u=it.unidad||"u";
  return [it.proveedor, Q.format(n(it.uso))+" "+u+" × "+$m2(unitP(it))+"/"+u].filter(Boolean).join(" · ");
}

function gcHTML(p){
  var G=state.compartidos, t=telaItem(p), mats=p.items.filter(function(i){return i.clase!=="fijo";}), h='';
  h+='<div class="gc-info">Son los gastos que pagás una vez para todo (flete del rollo, publicación, financiación…). Se cargan acá una sola vez y se reparten solos entre todos los productos <b>según los metros de tela que usa cada uno</b>, así el costo por unidad es correcto con cualquier combinación.</div>';
  (G.gastos||[]).forEach(function(g){
    h+='<div class="item'+(g.incluir===false?' off':'')+'" role="button" tabindex="0" data-a="gc-edit" data-id="'+esc(g.id)+'"><div class="main"><div class="t">'+esc(g.concepto||"Sin nombre")+'</div><div class="s">Total '+$m(n(g.total))+'</div></div>'
      +'<div class="v">'+$m(g.incluir===false?0:n(g.total)/(n(G.rollo)||1)*metrosTela(p))+'</div>'
      +'<button class="sw" role="switch" aria-checked="'+(g.incluir===false?'false':'true')+'" aria-label="Incluir '+esc(g.concepto)+'" data-a="gc-toggle" data-id="'+esc(g.id)+'"></button></div>';
  });
  if(!(G.gastos||[]).length) h+='<div class="empty">Todavía no cargaste gastos compartidos.</div>';
  h+='<button class="add" data-a="gc-new">+ Agregar gasto compartido</button>';
  var lotes=[]; state.productos.forEach(function(x){ x.items.forEach(function(i){ if(i.clase==="fijo"&&i.base==="lote") lotes.push(i); }); });
  if(lotes.length) h+='<div class="gc-warn">Tenés '+lotes.length+' costo'+(lotes.length>1?'s':'')+' cargado'+(lotes.length>1?'s':'')+' como “Total del lote” dentro de los productos. Si son gastos de todo el negocio (flete, publicación, financiación), pasalos acá para no contarlos dos veces. <button class="pbtn" data-a="gc-migrar">Pasarlos a compartidos</button></div>';
  h+='<div class="kv"><span>Metros de tela del rollo</span><div class="lote-in"><input id="gc-rollo" type="number" inputmode="decimal" min="1" step="any" value="'+esc(G.rollo)+'"></div></div>';
  h+='<div class="gc-calc">A esta funda le corresponden <b>'+$m(gcUnit(p))+'</b> por unidad, porque usa '+Q.format(metrosTela(p))+' m de los '+Q.format(n(G.rollo))+' m del rollo.</div>';
  if(!t) h+='<div class="gc-warn">Este producto no tiene ningún material en metros, así que no le toca parte de los gastos compartidos.</div>';
  return h;
}
function itemHTML(p,it){
  return '<div class="item'+(it.incluir?'':' off')+'" data-id="'+esc(it.id)+'" role="button" tabindex="0" data-a="edit">'
    +'<div class="main"><div class="t">'+esc(it.concepto||"Sin nombre")+'</div><div class="s">'+esc(subline(p,it))+'</div></div>'
    +'<div class="v" data-cost>'+$m(cost(p,it))+'</div>'
    +'<button class="sw" role="switch" aria-checked="'+(it.incluir?'true':'false')+'" aria-label="Incluir '+esc(it.concepto)+'" data-a="toggle"></button></div>';
}
function heroHTML(p){
  var c=calc(p), pr=n(p.precio);
  var cw=pr>0?Math.min(100,Math.max(0,c.total/pr*100)):100, gw=Math.max(0,100-cw);
  return '<div class="row"><div><div class="lbl">Ganás por unidad</div><div class="gain">'+$m(c.gan)+'</div></div>'
    +'<div class="rent"><span class="lbl">Rentabilidad</span><b>'+P.format(c.rent)+'%</b></div></div>'
    +'<div class="bar" aria-hidden="true"><span class="c" style="width:'+cw+'%"></span><span class="g" style="width:'+gw+'%"></span></div>'
    +'<div class="legend"><span><i style="background:rgba(255,255,255,.55)"></i>Gastás '+$m(c.total)+'</span><span><i style="background:var(--amber)"></i>Margen '+P.format(c.margen)+'% del precio</span></div>'
    +'<div class="price"><label for="precio">Vendés a</label><button class="step" data-a="pminus" aria-label="Bajar 5.000">−5k</button><input id="precio" type="number" inputmode="numeric" min="0" step="any" value="'+esc(p.precio)+'"><button class="step" data-a="pplus" aria-label="Subir 5.000">+5k</button></div>';
}
function loteHTML(p){
  var c=calc(p);
  return '<div class="kv"><span>Unidades del lote</span><div class="lote-in"><button data-a="lminus" aria-label="Menos">−</button><input id="lote" type="number" inputmode="numeric" min="1" step="1" value="'+esc(p.lote)+'"><button data-a="lplus" aria-label="Más">+</button></div></div>'
    +'<div class="kv"><span>Compra de materiales (redondeada)</span><b>'+$m(c.compras)+'</b></div>'
    +(c.fab?'<div class="kv"><span>Costos al fabricar (todo el lote)</span><b>'+$m(c.fab*n(p.lote))+'</b></div>':'')
    +'<div class="kv hl"><span>Inversión inicial</span><b>'+$m(c.inv)+'</b></div>'
    +(c.venta?'<div class="kv"><span>Costos por venta (todo el lote)</span><b>'+$m(c.ventaLote)+'</b></div>':'')
    +'<div class="kv"><span>Ingreso si vendés todo</span><b>'+$m(c.ingreso)+'</b></div>'

    +'<div class="kv"><span>Ventas para recuperar la inversión</span><b>'+(c.recupero==null?"—":c.recupero)+'</b></div>';

function refresh(){
  var p=prod(); if(!p) return; var c=calc(p);
  var gcEl=$("#gc"); if(gcEl){ var ae=document.activeElement; if(!(ae&&ae.id==="gc-rollo")) gcEl.innerHTML=gcHTML(p); else { var cc=gcEl.querySelector(".gc-calc"); if(cc){ var tmp2=document.createElement("div"); tmp2.innerHTML=gcHTML(p); cc.innerHTML=tmp2.querySelector(".gc-calc").innerHTML; } }
    var tt=gcEl.parentNode.querySelector(".sec-h .tot"); if(tt) tt.textContent=$m(gcUnit(p)); }
  var hero=$("#hero"); if(hero){ var a=document.activeElement, focusP=a&&a.id==="precio";
    if(!focusP) hero.innerHTML=heroHTML(p); else {
      var pr=n(p.precio), cw=pr>0?Math.min(100,Math.max(0,c.total/pr*100)):100;
      $(".gain",hero).textContent=$m(c.gan); $(".rent b",hero).textContent=P.format(c.rent)+"%";
      var bars=hero.querySelectorAll(".bar span"); bars[0].style.width=cw+"%"; bars[1].style.width=(100-cw)+"%";
      var lg=hero.querySelectorAll(".legend span"); lg[0].lastChild.textContent="Gastás "+$m(c.total); lg[1].lastChild.textContent="Margen "+P.format(c.margen)+"% del precio";
    } }
  var lote=$("#lote"); if(lote){ var a2=document.activeElement; if(!(a2&&a2.id==="lote")) lote.innerHTML=loteHTML(p); else {
      var tmp=document.createElement("div"); tmp.innerHTML=loteHTML(p); var rows=lote.querySelectorAll(".kv"), nr=tmp.querySelectorAll(".kv");
      for(var i=1;i<nr.length;i++){ if(rows[i]) rows[i].innerHTML=nr[i].innerHTML; else lote.appendChild(nr[i].cloneNode(true)); }
      for(var j=nr.length;j<rows.length;j++) rows[j].remove();
    } }
  var tm=$("#tot-mat"); if(tm) tm.textContent=$m(c.mat);
  var tf=$("#tot-fijo"); if(tf) tf.textContent=$m(c.fab+c.venta);
  document.querySelectorAll(".item[data-id]").forEach(function(el){
    var it=p.items.find(function(x){return x.id===el.dataset.id;}); if(!it) return;
    el.querySelector("[data-cost]").textContent=$m(cost(p,it)); el.querySelector(".s").textContent=subline(p,it);
  });
}

  if(e.target.dataset.pv&&provDraft){ provDraft[e.target.dataset.pv]=e.target.value; return; }
  var k=e.target.dataset.d; if(!k||!draft) return; var v=e.target.value;
  draft[k]=(e.target.type==="number")?(v===""?"":n(v)):v;
  if(k==="proveedor"){ var pr=provNames()[v]; if(pr){ var te=$('[data-d="telefono"]'), lu=$('[data-d="lugar"]'); if(te&&!te.value){te.value=pr.telefono||"";draft.telefono=te.value;} if(lu&&!lu.value){lu.value=pr.lugar||"";draft.lugar=lu.value;} } }
  updPreview();
});
$("#sheet").addEventListener("change",function(e){ var k=e.target.dataset.d; if(k&&e.target.tagName==="SELECT"&&draft){ draft[k]=e.target.value; updPreview(); } });

function listaSheet(){
  var p=prod(), c=calc(p), rows=p.items.filter(function(i){return i.clase!=="fijo"&&i.incluir;});
  var h='<div class="sh-h"><h3>Lista de compras</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></div>'
    +'<p class="mini" style="margin:0 0 8px">Para '+Q.format(n(p.lote))+' unidades de '+esc(p.nombre||"producto")+'</p><div class="plist">';
  rows.forEach(function(it){ var cp=compra(p,it), u=it.unidad||"u";
    h+='<div class="row"><div style="min-width:0"><b>'+esc(it.concepto||"-")+'</b><div class="mini">'+cp.buy+' '+esc(pl(it.envase,cp.buy))+' de '+Q.format(n(it.contenido))+' '+esc(u)+(it.proveedor?' · '+esc(it.proveedor):'')+'</div>'
      +(cp.sobra>0?'<div class="mini">Sobran '+Q.format(cp.sobra)+' '+esc(u)+'</div>':'')+'</div><b>'+$m(cp.total)+'</b></div>'; });
  h+='</div><div class="kv hl" style="border-radius:10px;margin-top:8px"><span>Total de la compra</span><b>'+$m(c.compras)+'</b></div>';
  openSheet(h);
}

function prodsSheet(){
  var a=prod();
  var h='<div class="sh-h"><h3>Productos</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></div><div>'
    +state.productos.map(function(p){ var c=calc(p); return '<button class="prod-row" data-a="pick" data-id="'+esc(p.id)+'"><span><b>'+esc(p.nombre||"Producto")+'</b><br><span class="mini">Ganás '+$m(c.gan)+' por unidad</span></span><span>'+(p.id===a.id?"✓":"")+'</span></button>'; }).join("")
    +'</div><label class="f" style="margin-top:14px">Nombre del producto actual<input id="pname" value="'+esc(a.nombre)+'"></label>'
    +'<div class="sh-actions"><button class="btn" data-a="dup">Duplicar</button><button class="btn" data-a="new-prod">Nuevo</button></div>'
    +'<div class="sh-actions"><button class="btn danger" data-a="del-prod">Eliminar este producto</button></div>';
  openSheet(h);
}
function provsSheet(){
  var h='<div class="sh-h"><h3>Proveedores</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></div>';
  if(!state.proveedores.length) h+='<p class="mini">Todavía no cargaste proveedores.</p>';
  h+='<div class="plist">'+state.proveedores.map(function(pv){
    var cosas=[]; state.productos.forEach(function(p){ p.items.forEach(function(i){ if((i.proveedor||"").trim().toLowerCase()===(pv.nombre||"").trim().toLowerCase() && cosas.indexOf(i.concepto)<0) cosas.push(i.concepto); }); });
    var tel=String(pv.telefono||"").replace(/[^\d]/g,"");
    return '<div class="row"><button class="prod-row" style="border:0;padding:0;flex:1;min-width:0" data-a="edit-prov" data-id="'+esc(pv.id)+'"><span style="min-width:0"><b>'+esc(pv.nombre||"Sin nombre")+'</b><span class="mini" style="display:block">'+esc([pv.lugar,pv.telefono].filter(Boolean).join(" · ")||"Sin contacto")+'</span>'
      +(cosas.length?'<span class="mini" style="display:block">'+esc(cosas.join(", "))+'</span>':'')+'</span></button>'
      +(tel?'<a class="wa" href="https://wa.me/'+tel+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'</div>'; }).join("")+'</div>'
    +'<div class="sh-actions" style="margin-top:12px"><button class="btn pri" data-a="new-prov">+ Agregar proveedor</button></div>';
  openSheet(h);
}
var provDraft=null, provNew=false, provOld="";
function provEditor(pv,isNew){
  provDraft=JSON.parse(JSON.stringify(pv)); provNew=isNew; provOld=pv.nombre||"";
  var h='<div class="sh-h"><h3>'+(isNew?"Nuevo proveedor":"Editar proveedor")+'</h3><button class="x" data-a="provs" aria-label="Volver">×</button></div>'
    +'<label class="f">Nombre<input data-pv="nombre" value="'+esc(provDraft.nombre)+'" placeholder="Ej. Mercería del Litoral"></label>'
    +'<div class="g2"><label class="f">Teléfono / WhatsApp<input data-pv="telefono" inputmode="tel" value="'+esc(provDraft.telefono)+'"></label>'
    +'<label class="f">Lugar<input data-pv="lugar" value="'+esc(provDraft.lugar)+'"></label></div>'
    +'<label class="f">Web o Instagram<input data-pv="web" value="'+esc(provDraft.web)+'"></label>'
    +'<label class="f">Notas<textarea data-pv="notas" rows="3" placeholder="Qué vende, mínimos de compra, formas de pago…">'+esc(provDraft.notas)+'</textarea></label>'
    +'<div class="sh-actions">'+(isNew?'':'<button class="btn danger" data-a="del-prov">Eliminar</button>')+'<button class="btn pri" data-a="save-prov">Guardar</button></div>';
  openSheet(h);
}
function shareText(p){
  var c=calc(p), L2=[];
  L2.push((p.nombre||"Producto").toUpperCase()); L2.push("");
  L2.push("MATERIALES (por unidad)");
  p.items.filter(function(i){return i.clase!=="fijo"&&i.incluir;}).forEach(function(i){ L2.push("• "+(i.concepto||"-")+": "+$m(cost(p,i))); });
  L2.push("Total materiales: "+$m(c.mat)); L2.push("");
  var fx=p.items.filter(function(i){return i.clase==="fijo"&&i.incluir;});
  if(fx.length){ L2.push("OTROS COSTOS"); fx.forEach(function(i){ L2.push("• "+(i.concepto||"-")+": "+$m(cost(p,i))); }); L2.push(""); }
  if(gcUnit(p)>0){ L2.push("GASTOS COMPARTIDOS (por metro de tela)"); L2.push("• "+$m(gcTotal())+" ÷ "+Q.format(n(state.compartidos.rollo))+" m × "+Q.format(metrosTela(p))+" m = "+$m(gcUnit(p))); L2.push(""); }
  L2.push("Costo total por unidad: "+$m(c.total));
  L2.push("Precio de venta: "+$m(n(p.precio)));
  L2.push("Ganancia por unidad: "+$m(c.gan)+" ("+P.format(c.rent)+"% sobre costo)"); L2.push("");
  L2.push("LOTE DE "+Q.format(n(p.lote))+" UNIDADES");
  L2.push("Compra de materiales: "+$m(c.compras));
  L2.push("Inversión inicial: "+$m(c.inv));
  L2.push("Ganancia del lote: "+$m(c.ganLote));
  if(c.recupero) L2.push("Recuperás la inversión con "+c.recupero+" ventas");
  return L2.join("\n");
}
function shareSheet(){
  var t=shareText(prod());
  openSheet('<div class="sh-h"><h3>Compartir cuadro</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></div>'
    +'<label class="f">Texto para copiar o mandar<textarea class="share" id="sharetxt" readonly>'+esc(t)+'</textarea></label>'
    +'<div class="sh-actions"><button class="btn" data-a="copy">Copiar</button><a class="btn pri" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(t)+'">Mandar por WhatsApp</a></div>');
}

/* ---------- eventos ---------- */
function gcEditar(g,nuevo){
  openSheet('<div class="sh-h"><h3>'+(nuevo?'Nuevo gasto compartido':'Editar gasto compartido')+'</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></div>'
    +'<label class="f">Concepto<input id="gc-c" value="'+esc(g.concepto||"")+'" placeholder="Ej. Flete del rollo"></label>'
    +'<label class="f">Monto total<input id="gc-t" type="number" inputmode="decimal" min="0" step="any" value="'+esc(g.total||"")+'" placeholder="Ej. 88000"></label>'
    +'<p class="mini">Se reparte solo entre todos los productos según los metros de tela que usa cada uno.</p>'
    +'<div class="sh-actions">'+(nuevo?'<button class="btn" data-a="close">Cancelar</button>':'<button class="btn danger" data-a="gc-del" data-id="'+esc(g.id)+'">Eliminar</button>')+'<button class="btn pri" data-a="gc-ok" data-id="'+esc(g.id)+'" data-nuevo="'+(nuevo?1:0)+'">Guardar</button></div>');
}
document.addEventListener("change",function(e){
  if(e.target.id==="gc-tela"){ var p=prod(); p.telaId=e.target.value||""; save(); refresh(); }
});
document.addEventListener("input",function(e){
  if(e.target.id==="gc-rollo"){ state.compartidos.rollo=n(e.target.value)||0; save(); refresh(); }
});
document.addEventListener("click",function(e){
  var gb=e.target.closest("[data-a^='gc-']");
  if(gb){ var ga=gb.dataset.a, gid=gb.dataset.id, G=state.compartidos;
    if(ga==="gc-toggle"){ e.stopPropagation(); var g1=G.gastos.find(function(x){return x.id===gid;}); g1.incluir=g1.incluir===false; save(); refresh(); return; }
    if(ga==="gc-new"){ gcEditar({id:uid()},true); return; }
    if(ga==="gc-edit"){ gcEditar(G.gastos.find(function(x){return x.id===gid;}),false); return; }
    if(ga==="gc-ok"){ var c=($("#gc-c").value||"").trim(), tv=n($("#gc-t").value); if(!c){ toast("Poné el concepto"); return; }
      if(gb.dataset.nuevo==="1") G.gastos.push({id:gid,concepto:c,total:tv,incluir:true}); else { var g2=G.gastos.find(function(x){return x.id===gid;}); g2.concepto=c; g2.total=tv; }
      closeSheet(); save(); refresh(); toast("Gasto guardado"); return; }
    if(ga==="gc-del"){ if(!confirm("¿Eliminar este gasto compartido?")) return; G.gastos=G.gastos.filter(function(x){return x.id!==gid;}); closeSheet(); save(); refresh(); return; }
    if(ga==="gc-migrar"){
      var vistos={}, movidos=0;
      state.productos.forEach(function(x){ x.items=x.items.filter(function(i){
        if(!(i.clase==="fijo"&&i.base==="lote")) return true;
        var k=(i.concepto||"").trim().toLowerCase();
        var ex=G.gastos.find(function(g){return (g.concepto||"").trim().toLowerCase()===k;});
        if(!ex&&!vistos[k]){ G.gastos.push({id:uid(),concepto:i.concepto,total:n(i.monto),incluir:i.incluir!==false}); vistos[k]=1; }
        movidos++; return false; }); });
      save(); render(); toast(movidos+" costos pasados a compartidos"); return; }
  }

  var b=e.target.closest("[data-a]"); if(!b) return; var a=b.dataset.a, p=prod();
  if(a==="toggle"){ e.stopPropagation(); var row=b.closest("[data-id]"), it=p.items.find(function(x){return x.id===row.dataset.id;}); it.incluir=!it.incluir; save(); render(); return; }
  if(a==="edit"){ var it2=p.items.find(function(x){return x.id===b.dataset.id;}); if(it2) editItem(it2,false); return; }
  if(a==="new-compra"){ editItem({id:uid(),clase:"compra",concepto:"",proveedor:"",telefono:"",lugar:"",envase:"unidad",precio:"",contenido:1,unidad:"u",uso:1,incluir:true,notas:""},true); return; }
  if(a==="new-fijo"){ editItem({id:uid(),clase:"fijo",concepto:"",proveedor:"",telefono:"",lugar:"",monto:"",cuando:"fab",base:"unidad",incluir:true,notas:""},true); return; }
  if(a==="base"){ draft.base=b.dataset.v; editItem(draft,draftNew); return; }
  if(a==="lista"){ listaSheet(); return; }
  if(a==="save-item"){ ensureProv(draft); if(draftNew) p.items.push(draft); else { var i=p.items.findIndex(function(x){return x.id===draft.id;}); if(i>=0) p.items[i]=draft; }
    draft=null; closeSheet(); save(); render(); toast("Guardado"); return; }
  if(a==="del-item"){ if(confirm("¿Eliminar "+(draft.concepto||"este renglón")+"?")){ p.items=p.items.filter(function(x){return x.id!==draft.id;}); draft=null; closeSheet(); save(); render(); toast("Eliminado"); } return; }
  if(a==="close"){ draft=null; closeSheet(); return; }
  if(a==="prods"){ prodsSheet(); return; }
  if(a==="np"){ openSheet('<div class="sh-h"><h3>Nuevo producto</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></div>'
      +'<label class="f">Nombre<input id="np-name" placeholder="Ej. Funda tipo canasto individual"></label>'
      +'<label class="f">Empezar desde<select id="np-base"><option value="">Vacío (sin materiales)</option>'+state.productos.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===p.id?' selected':'')+'>Copia de '+esc(x.nombre||"Producto")+'</option>';}).join("")+'</select></label>'
      +'<p class="mini">Copiar te ahorra cargar de nuevo materiales y proveedores: después ajustás cantidades y precios.</p>'
      +'<div class="sh-actions"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="np-ok">Crear producto</button></div>'); return; }
  if(a==="np-ok"){ var nn=($("#np-name").value||"").trim(); if(!nn){ toast("Poné un nombre"); return; }
    var base=$("#np-base").value, src=state.productos.find(function(x){return x.id===base;}), np2;
    if(src){ np2=JSON.parse(JSON.stringify(src)); np2.items.forEach(function(x){x.id=uid();}); } else np2={lote:1,precio:0,items:[]};
    np2.id=uid(); np2.nombre=nn; state.productos.push(np2); state.activo=np2.id; closeSheet(); save(); render(); toast("Producto creado"); return; }
  if(a==="ren"){ openSheet('<div class="sh-h"><h3>Nombre del producto</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></div>'
      +'<label class="f">Nombre<input id="rn-name" value="'+esc(p.nombre||"")+'"></label>'
      +'<div class="sh-actions"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="rn-ok">Guardar</button></div>'); return; }
  if(a==="rn-ok"){ var rn=($("#rn-name").value||"").trim(); if(!rn){ toast("Poné un nombre"); return; } p.nombre=rn; closeSheet(); save(); render(); toast("Nombre guardado"); return; }
  if(a==="dup2"){ var cp2=JSON.parse(JSON.stringify(p)); cp2.id=uid(); cp2.nombre=(p.nombre||"Producto")+" (copia)"; cp2.items.forEach(function(x){x.id=uid();}); state.productos.push(cp2); state.activo=cp2.id; save(); render();
    openSheet('<div class="sh-h"><h3>Nombre de la copia</h3><button class="x" data-a="close" aria-label="Cerrar">×</button></div><label class="f">Nombre<input id="rn-name" value="'+esc(cp2.nombre)+'"></label><div class="sh-actions"><button class="btn" data-a="close">Más tarde</button><button class="btn pri" data-a="rn-ok">Guardar</button></div>'); return; }
  if(a==="pick"){ state.activo=b.dataset.id; closeSheet(); save(); render(); return; }
  if(a==="new-prod"){ var np={id:uid(),nombre:"Nuevo producto",lote:1,precio:0,items:[]}; state.productos.push(np); state.activo=np.id; closeSheet(); save(); render(); return; }
  if(a==="dup"){ var cp=JSON.parse(JSON.stringify(p)); cp.id=uid(); cp.nombre=(p.nombre||"Producto")+" (copia)"; cp.items.forEach(function(x){x.id=uid();}); state.productos.push(cp); state.activo=cp.id; closeSheet(); save(); render(); toast("Producto duplicado"); return; }
  if(a==="del-prod"){ if(confirm("¿Eliminar "+(p.nombre||"este producto")+"?")){ state.productos=state.productos.filter(function(x){return x.id!==p.id;}); state.activo=state.productos[0]?state.productos[0].id:null; closeSheet(); save(); render(); } return; }
  if(a==="provs"){ provDraft=null; provsSheet(); return; }
  if(a==="new-prov"){ provEditor({id:uid(),nombre:"",telefono:"",lugar:"",web:"",notas:""},true); return; }
  if(a==="edit-prov"){ var pe=state.proveedores.find(function(x){return x.id===b.dataset.id;}); if(pe) provEditor(pe,false); return; }
  if(a==="save-prov"){ var nm=(provDraft.nombre||"").trim(); if(!nm){ toast("Poné un nombre"); return; }
    var dup=findProv(nm); if(dup&&dup.id!==provDraft.id){ toast("Ya existe un proveedor con ese nombre"); return; }
    provDraft.nombre=nm;
    if(provNew) state.proveedores.push(provDraft); else { var ix=state.proveedores.findIndex(function(x){return x.id===provDraft.id;}); if(ix>=0) state.proveedores[ix]=provDraft; }
    state.productos.forEach(function(pr){ pr.items.forEach(function(it){ if(!provNew && (it.proveedor||"").trim().toLowerCase()===provOld.trim().toLowerCase()){ it.proveedor=nm; it.telefono=provDraft.telefono; it.lugar=provDraft.lugar; } }); });
    provDraft=null; save(); render(); provsSheet(); toast("Proveedor guardado"); return; }
  if(a==="del-prov"){ if(confirm("¿Eliminar "+(provDraft.nombre||"este proveedor")+"? Los materiales que lo usan conservan el nombre.")){ state.proveedores=state.proveedores.filter(function(x){return x.id!==provDraft.id;}); provDraft=null; save(); render(); provsSheet(); toast("Proveedor eliminado"); } return; }
  if(a==="share"){ shareSheet(); return; }
  if(a==="copy"){ var ta=$("#sharetxt"); ta.select(); var ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    if(navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(function(){toast("Copiado");},function(){toast(ok?"Copiado":"Seleccionalo y copialo a mano");}); } else toast(ok?"Copiado":"Seleccionalo y copialo a mano"); return; }
  if(a==="pminus"||a==="pplus"){ p.precio=Math.max(0,n(p.precio)+(a==="pplus"?5000:-5000)); save(); refresh(); return; }
  if(a==="lminus"||a==="lplus"){ p.lote=Math.max(1,n(p.lote)+(a==="lplus"?1:-1)); save(); refresh(); return; }
});
document.addEventListener("keydown",function(e){ if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("item")){ e.preventDefault(); e.target.click(); } });
document.addEventListener("input",function(e){
  var p=prod(); if(!p) return;
  if(e.target.id==="precio"){ p.precio=e.target.value===""?"":n(e.target.value); save(); refresh(); }
  else if(e.target.id==="lote"){ p.lote=e.target.value===""?"":Math.max(0,Math.round(n(e.target.value))); save(); refresh(); }
  else if(e.target.id==="pname"){ p.nombre=e.target.value; save(); var nm=$(".prod-btn .name"); if(nm) nm.textContent=p.nombre||"Producto"; }
});
$("#sheet").addEventListener("close",function(){ draft=null; });

boot();
})();
</script>
